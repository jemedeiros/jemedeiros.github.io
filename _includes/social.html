<div id="social-media" class="dm-social{% if include.horizontal %} dm-social--horizontal{% endif %}">
  {% for social in site.data.social %}
  <a href="{{ social.href }}{{ social.id | cgi_escape }}"
     title="{{ social.title }}"
     target="_blank"
     rel="noopener noreferrer">
    <i class="fa {{ social['fa-icon'] }}"></i>
    <span class="dm-social-label">{{ social.title }}</span>
  </a>
  {% endfor %}
</div>

<style>
.dm-social {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
{% comment %} /* Horizontal variant — use {% include social.html horizontal=true %} */ {% endcomment %}
.dm-social--horizontal {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
}

.dm-social a {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  color: #A8935A;
  text-decoration: none;
  font-family: var(--font-mono, 'Share Tech Mono', monospace);
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  transition: color 0.15s ease;
}
.dm-social a:hover { color: #E8D5A3; }

.dm-social a i {
  font-size: 1rem;
  flex-shrink: 0;
}

/* Hide text labels in horizontal compact mode */
.dm-social--horizontal .dm-social-label { display: none; }

/* In footer the label shows via parent ::after — keep label hidden there too */
#social-media.dm-social a .dm-social-label { display: none; }
</style>
