<div id="social-media" class="dm-social{% if include.horizontal %} dm-social--horizontal{% endif %}">
  {% for social in site.data.social %}
  <a href="{{ social.href }}{{ social.id | cgi_escape }}"
     title="{{ social.title }}"
     target="_blank"
     rel="noopener noreferrer">
    <i class="fa {{ social['fa-icon'] }}"></i>
    <span class="dm-social-label">{{ social.title }}</span>
  </a>
  {% endfor %}
</div>
