<nav class="dm-nav" id="myTopnav">
  <a class="dm-nav-brand" href="/">
    <span class="dm-nav-brand-name">de Medeiros</span>
  </a>

  <div class="dm-nav-links" id="dm-nav-links">
    {% for item in site.data.navigation %}
    <a href="{{ item.link }}"
       class="dm-nav-link{% if page.url == item.link %} dm-nav-link--active{% endif %}">
      {{ item.name }}
    </a>
    {% endfor %}
  </div>

  <button class="dm-nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          id="dm-nav-toggle">
    <i class="fa fa-bars"></i>
  </button>
</nav>

<script>
// Inline — guaranteed available before any external scripts load
(function () {
  var toggle = document.getElementById('dm-nav-toggle');
  var links  = document.getElementById('dm-nav-links');
  if (!toggle || !links) return;

  toggle.addEventListener('click', function () {
    var open = links.classList.toggle('dm-nav-open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // Close nav when a link is tapped on mobile
  links.querySelectorAll('.dm-nav-link').forEach(function (link) {
    link.addEventListener('click', function () {
      links.classList.remove('dm-nav-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>
